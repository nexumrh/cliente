<style>
[hidden]{display:none!important}
:root{--ink:#0A1733;--ink2:#13244D;--bg:#F4F4F8;--card:#fff;--line:#E2E1EC;--txt:#1B1A2E;--mut:#696784;--pri:#1A5CFF;--pri-s:#E8F0FF;--gold:#E2B33B;
  --ok:#0E8A5F;--ok-s:#E3F4EC;--warn:#A86A12;--warn-s:#FBF1DF;--bad:#C23B3B;--bad-s:#FBE7E7;--f:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--f);font-size:15px;line-height:1.5;color:var(--txt);background:var(--bg);-webkit-font-smoothing:antialiased;min-height:100vh}
.top{background:var(--ink);color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:10px}.brand img{height:22px}.brand i{width:1px;height:20px;background:rgba(255,255,255,.35)}.brand span{font-weight:600;letter-spacing:.12em;color:#9DB7F5}
.top button{background:transparent;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
main{max-width:640px;margin:0 auto;padding:18px 16px 60px}
h1{font-size:22px;margin:4px 0 4px}h2{font-size:17px;margin:0 0 10px}h3{font-size:15px;margin:16px 0 6px}
.muted{color:var(--mut)}.small{font-size:13px}.mono{font-family:ui-monospace,Consolas,monospace}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:14px;box-shadow:0 1px 2px rgba(10,23,51,.04)}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500;color:var(--mut);margin-top:12px}
input,select,textarea{font:inherit;font-size:16px;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri-s);border-color:var(--pri)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:600;border-radius:10px;padding:12px 16px;border:1px solid var(--line);background:#fff;color:var(--txt);cursor:pointer;text-decoration:none;min-height:46px}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--ink)}.btn.red{background:var(--bad);border-color:var(--bad);color:#fff}.btn.green{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.full{width:100%}.btn:disabled{opacity:.55;cursor:not-allowed}.btn.sm{min-height:36px;padding:7px 12px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hero{background:linear-gradient(135deg,var(--ink),var(--ink2));color:#fff;border-radius:16px;padding:22px 20px;margin-top:6px}
.hero small{color:#A9B6D3}.hero b{display:block;font-size:28px;margin:2px 0}
.badge{display:inline-block;font-size:12px;font-weight:600;border-radius:20px;padding:3px 10px}
.b-green{background:var(--ok-s);color:var(--ok)}.b-red{background:var(--bad-s);color:var(--bad)}.b-amber{background:var(--warn-s);color:var(--warn)}.b-blue{background:var(--pri-s);color:var(--pri)}.b-gray{background:#EEEDF4;color:var(--mut)}
.parc{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.parc:first-child{border-top:0}.parc .v{text-align:right}.parc .v b{display:block}
.aviso{border-radius:12px;padding:12px 14px;margin-top:12px;font-size:14px}.aviso.bad{background:var(--bad-s);color:#7A1F1F}.aviso.ok{background:var(--ok-s);color:#0B5B3F}.aviso.warn{background:var(--warn-s);color:#6E4508}
.erro{color:var(--bad);font-size:14px;min-height:20px;margin-top:8px}
.contrato{border:1px solid var(--line);border-radius:10px;padding:16px;max-height:52vh;overflow-y:auto;font-family:Georgia,serif;font-size:14px;line-height:1.6;background:#FCFCFE}
.contrato h4{font-family:var(--f);font-size:13.5px;margin:12px 0 4px}
.check{flex-direction:row;align-items:flex-start;gap:10px;color:var(--txt);font-weight:400;font-size:14px}.check input{width:22px;height:22px;flex:none;margin-top:1px}
canvas.sig{width:100%;height:180px;border:2px dashed #B9C6E4;border-radius:12px;background:#fff;touch-action:none;display:block}
.modal{position:fixed;inset:0;background:rgba(10,23,51,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal[hidden]{display:none}.mbox{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:20px 18px 28px;position:relative}
@media(min-width:620px){.modal{align-items:center}.mbox{border-radius:18px}}
.x{position:absolute;right:12px;top:10px;border:0;background:transparent;font-size:28px;line-height:1;color:var(--mut);cursor:pointer}
.qr{width:230px;margin:10px auto}.qr svg{width:100%;height:auto}
.cod{word-break:break-all;font-family:ui-monospace,Consolas,monospace;font-size:12px;background:#F4F4F8;border-radius:8px;padding:10px;color:var(--mut)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:30}
#toast div{background:var(--ink);color:#fff;border-radius:10px;padding:10px 16px;margin-top:8px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
#toast div.err{background:var(--bad)}#toast div.ok{background:var(--ok)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--pri-s);border-top-color:var(--pri);border-radius:50%;animation:g .8s linear infinite;vertical-align:-3px}
@keyframes g{to{transform:rotate(360deg)}}
.center{text-align:center}svg.ico{width:17px;height:17px;vertical-align:-3px;flex:none}.btn:has(>svg.ico){display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}.ic{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;margin:0 auto 10px}.ic svg{width:32px;height:32px}
.ic.ok{background:var(--ok-s);color:var(--ok)}.ic.bad{background:var(--bad-s);color:var(--bad)}
a{color:var(--pri)}
.nps{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}.nps button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fff;font:inherit;font-weight:600;cursor:pointer}
.chat{max-height:46vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px}
.bolha{max-width:85%;padding:9px 13px;border-radius:14px;font-size:14px;line-height:1.45}.bolha.ia{background:#F0F3FA;align-self:flex-start;border-bottom-left-radius:4px}.bolha.eu{background:var(--pri);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.chat-btn{position:fixed;right:16px;bottom:18px;z-index:15;background:var(--ink);color:#fff;border:0;border-radius:24px;padding:12px 18px;font:inherit;font-weight:600;box-shadow:0 8px 24px rgba(10,23,51,.3);cursor:pointer}
/* ===== camada "nível banco" ===== */
.bk-top{background:linear-gradient(160deg,#0B1E3F,#16305C);color:#fff;padding:18px 16px 24px;border-radius:0 0 22px 22px;margin:-18px -16px 0}
.bk-hi{display:flex;justify-content:space-between;align-items:center}
.bk-hi small{color:#AFBDD9;font-size:12.5px}.bk-hi b{font-size:17px;display:block}
.bk-av{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;font-weight:700;font-size:14px}
.bk-saldo{margin-top:16px}
.bk-saldo small{color:#AFBDD9;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.bk-saldo .v{font-size:31px;font-weight:800;letter-spacing:-.5px;margin-top:2px}
.bk-saldo .sub{color:#C9D4EE;font-size:12.5px}
.bk-prog{height:7px;background:rgba(255,255,255,.16);border-radius:6px;margin-top:11px;overflow:hidden}
.bk-prog i{display:block;height:100%;background:#C8992F;border-radius:6px}
.bk-progl{display:flex;justify-content:space-between;color:#C9D4EE;font-size:11.5px;margin-top:6px}
.bk-body{padding-bottom:78px}
.bk-sect{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin:16px 2px 9px}
.bk-atalhos{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.bk-atalho{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 3px;text-align:center;cursor:pointer}
.bk-atalho .ic{width:36px;height:36px;border-radius:11px;background:#F1F4F9;display:grid;place-items:center;margin:0 auto 6px;color:#0B1E3F}
.bk-atalho span{font-size:10.5px;font-weight:600;color:#38435C;line-height:1.2;display:block}
.bk-mini{display:flex;gap:11px}
.bk-mini .m{flex:1;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}
.bk-mini small{color:var(--mut);font-size:11.5px}.bk-mini b{display:block;font-size:19px;margin-top:2px}
.bk-ap{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:9px;cursor:pointer}
.bk-ap .ap-ic{width:42px;height:42px;border-radius:12px;background:#F1F4F9;display:grid;place-items:center;color:#0B1E3F;flex:none}
.bk-ex{display:flex;align-items:center;gap:11px;padding:12px 0;border-top:1px solid var(--line)}
.bk-ex:first-child{border-top:0}
.bk-ex .dot{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center}
.bk-ex .t{flex:1}.bk-ex .t b{font-size:13.5px}.bk-ex .t span{color:var(--mut);font-size:12px;display:block}
.bk-ex .amt{font-weight:700;font-size:13.5px;text-align:right}
.bk-nav{position:fixed;bottom:0;left:0;right:0;max-width:640px;margin:0 auto;background:#fff;border-top:1px solid var(--line);display:flex;padding:7px 4px 9px;z-index:40}
.bk-nav button{flex:1;border:0;background:transparent;font:inherit;color:var(--mut);font-size:10.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:3px 0}
.bk-nav button.on{color:#0B1E3F}.bk-nav button.on .ic{color:#A97B23}
.bk-voltar{background:none;border:0;color:#0B1E3F;font:inherit;font-weight:600;font-size:14px;cursor:pointer;padding:8px 0;display:flex;align-items:center;gap:6px}


/* ===== camada banco v2 (nov/2026): azul institucional, sem dourado ===== */
:root{--pri:#1450D2;--pri-d:#0D3A9E;--pri-s:#EAF0FD;--bg:#F3F5F9;--line:#E3E7EF;--txt:#0F1A33;--mut:#5F6B84;--navy:#0B1E3F}
body{font-feature-settings:"tnum" 1,"lnum" 1}
.top{background:var(--navy);box-shadow:0 1px 0 rgba(255,255,255,.06)}
.top button{border-color:rgba(255,255,255,.22);border-radius:10px;font-weight:600}
.card{border-radius:16px;border-color:var(--line);box-shadow:0 1px 3px rgba(15,26,51,.05)}
.btn{border-radius:12px;font-weight:600;letter-spacing:.1px;transition:background .15s,border-color .15s,box-shadow .15s}
.btn.gold,.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff;box-shadow:0 1px 2px rgba(20,80,210,.25)}
.btn.gold:hover,.btn.pri:hover{background:var(--pri-d);border-color:var(--pri-d)}
.btn:not(.gold):not(.pri):not(.red):not(.green){background:#fff;border-color:#D5DBE7;color:var(--navy)}
.btn:not(.gold):not(.pri):not(.red):not(.green):hover{background:#F5F7FB}
.btn.sm.gold{box-shadow:none}
.bk-top{background:var(--navy);box-shadow:0 0 0 100vmax var(--navy);clip-path:inset(0 -100vmax 0 -100vmax);border-radius:0;padding:22px 16px 30px}
.bk-saldo small{color:#9FB0D0;letter-spacing:.8px}
.bk-saldo .v{font-size:34px;font-weight:700;letter-spacing:-.8px}
.bk-prog{height:6px;background:rgba(255,255,255,.14)}
.bk-prog i{background:#4C8DFF}
.bk-av{background:#1C3566;border:1px solid rgba(255,255,255,.12)}
.bk-sect{color:#55617A;font-size:11.5px;letter-spacing:.9px;margin:22px 2px 10px}
.bk-atalho{border-radius:16px;padding:14px 4px 12px;transition:border-color .15s,box-shadow .15s}
.bk-atalho:hover{border-color:#C9D5F0;box-shadow:0 4px 14px rgba(15,26,51,.06)}
.bk-atalho .ic{background:var(--pri-s);color:var(--pri);border-radius:12px}
.bk-atalho span{color:#24304A;font-size:11px}
.bk-mini .m,.bk-ap{border-radius:16px}
.bk-ap .ap-ic{background:var(--pri-s);color:var(--pri)}
.bk-nav{box-shadow:0 -4px 18px rgba(15,26,51,.06);border-top-color:var(--line);padding-bottom:calc(9px + env(safe-area-inset-bottom))}
.bk-nav button.on{color:var(--pri)}.bk-nav button.on .ic{color:var(--pri)}
.bk-nav button.on::before{content:"";display:block;width:22px;height:3px;border-radius:3px;background:var(--pri);margin:-7px auto 4px}
.bk-voltar{color:var(--pri)}
.chat-btn{background:var(--pri);box-shadow:0 8px 24px rgba(20,80,210,.35)}
.bolha.eu{background:var(--pri)}
a{color:var(--pri)}
@media(min-width:700px){main{max-width:680px}.bk-nav{max-width:680px;border-radius:16px 16px 0 0}}

/* botão de atendimento igual ao do Nexum RH */
.chat-btn{width:58px;height:58px;padding:0!important;border-radius:50%!important;background:#0A1733!important;color:#fff;display:flex;align-items:center;justify-content:center;right:20px!important;bottom:20px!important;z-index:45!important;box-shadow:0 8px 24px rgba(10,23,51,.35)!important}
.chat-btn i{position:absolute;top:4px;right:4px;width:13px;height:13px;border-radius:50%;background:#EF4444;border:2px solid #fff}
.chat-btn.visto i{display:none}
@media(max-width:699px){.chat-btn{bottom:calc(100px + env(safe-area-inset-bottom))!important;right:14px!important}}

/* ===================== APP DO CLIENTE v3 (nov/2026) ===================== */
body.nx3{--navy:#0A1733;--blue:#2563EB;--blue-d:#1D4ED8;--mint:#3DDC97;--ok:#15803D;--ok-s:#DCFCE7;--warn:#B45309;--warn-s:#FEF3C7;--bad:#DC2626;--bad-s:#FEE2E2;--ink3:#0F172A;--mut:#64748B;--line:#E7ECF3;--bg:#F3F5FA;
  font-family:Inter,'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink3);font-feature-settings:"tnum" 1}
body.nx3 .top{display:none}body.nx3 main{max-width:560px;padding:0 0 100px}
.i3{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nx3 button{font-family:inherit;cursor:pointer}.nx3 .chat-btn{display:none!important}.qa3 a{font-size:11.5px}.nx3 a{text-decoration:none}
/* menu */
.nav3{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;z-index:40;background:rgba(255,255,255,.97);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(8px + env(safe-area-inset-bottom))}
.nav3 button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:#94A3B8;padding:6px 0;position:relative}
.nav3 button.on{color:var(--navy)}.nav3 button.on .i3{stroke:var(--blue)}.nav3 button.on::before{content:"";position:absolute;top:-7px;width:24px;height:3px;border-radius:3px;background:var(--blue)}
@media(min-width:600px){.nav3{border-radius:18px 18px 0 0;box-shadow:0 -6px 20px rgba(15,23,42,.06)}}
/* topo do início */
.hero3{background:radial-gradient(120% 100% at 100% 0%,#1E3A8A 0%,var(--navy) 58%);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 18px 84px;box-shadow:0 0 0 100vmax var(--navy);clip-path:inset(0 -100vmax 0 -100vmax)}

<script type="module">
/* Portal do cliente NexumCell: faturas, PIX, assinatura do contrato e comunicar roubo. */
const FIREBASE_CONFIG = window.NEXUMCELL_FIREBASE || {apiKey:''};
const DEMO = /[?&]demo\b/.test(location.search);
const FB_ON = !!FIREBASE_CONFIG.apiKey && !DEMO;
const FBV = '10.12.2', DEMO_KEY = 'nexumcell_demo_v1';
const LINKS = {
  celularSeguro: 'https://celularseguro.mj.gov.br',
  boFurto: 'https://www.parana.pr.gov.br/servicos/Servicos/Boletins-de-Ocorrencia/Registrar-Boletim-de-Ocorrencia-de-furto-xv3K1jo1',
};

/* ---------- utilitários ---------- */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = n => (Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const r2 = n => Math.round((Number(n)||0)*100)/100;
const onlyDig = s => String(s||'').replace(/\D/g,'');
function isoDate(d){ const z=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate()); }
const hoje = () => isoDate(new Date());
const fmtD = s => s ? String(s).split('-').reverse().join('/') : '—';
function fmtDT(ms){ if(!ms) return '—'; const d=new Date(ms); return d.toLocaleDateString('pt-BR')+' às '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }
function diasEntre(a,b){ const pa=a.split('-').map(Number), pb=b.split('-').map(Number); return Math.round((Date.UTC(pb[0],pb[1]-1,pb[2])-Date.UTC(pa[0],pa[1]-1,pa[2]))/86400000); }
function cpfOk(c){ c=onlyDig(c); if(c.length!==11||/^(\d)\1+$/.test(c)) return false; for(let t=9;t<11;t++){ let s=0; for(let i=0;i<t;i++) s+=+c[i]*(t+1-i); if(((s*10)%11)%10!==+c[t]) return false; } return true; }
const RMI={'doc': '<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M14 10h4M14 14h4M6 16h6"/>', 'face': '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>', 'dados': '<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/>', 'chat': '<path d="M21 12a8 8 0 0 1-11.8 7L4 20l1.1-4.3A8 8 0 1 1 21 12z"/>', 'lock': '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>', 'cam': '<path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/>', 'clock': '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>', 'fone': '<rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/>'};
const rmI = k => `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${RMI[k]}</svg>`;
const svg = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
function toast(t,k=''){ const d=document.createElement('div'); d.className=k; d.textContent=t; $('#toast').appendChild(d); setTimeout(()=>d.remove(),4200); }
function openModal(html){ $('#mbody').innerHTML=html; $('#modal').hidden=false; }
function closeModal(){ $('#modal').hidden=true; }
$('#mx').onclick=closeModal; $('#modal').addEventListener('click',e=>{ if(e.target.id==='modal') closeModal(); });
async function sha256(txt){ const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(String(txt))); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
const chaveAcesso = (cpf,nasc,tel4) => sha256(`nexumcell|${onlyDig(cpf)}|${nasc}|${onlyDig(tel4).slice(-4)}`);
const primeiroNome = n => String(n||'').trim().split(/\s+/)[0]||'';
const normNome = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim().toUpperCase();

/* ---------- dados (Firebase com login anônimo, ou demonstração) ---------- */
let fb=null;
const demoLer = () => { try{ return JSON.parse(localStorage.getItem(DEMO_KEY))||{}; }catch(e){ return {}; } };
const DB = {
  async get(c,id){
    if(!fb){ const d=demoLer(); const v=(d[c]||{})[id]; return v?{id,...v}:null; }
    const s=await fb.m.getDoc(fb.m.doc(fb.db,c,id)); return s.exists()?{id:s.id,...s.data()}:null;
  },
  async add(c,data){
    if(!fb){ const d=demoLer(); d[c]=d[c]||{}; const id='p'+Date.now().toString(36); d[c][id]=JSON.parse(JSON.stringify(data)); localStorage.setItem(DEMO_KEY,JSON.stringify(d)); return id; }
    const r=await fb.m.addDoc(fb.m.collection(fb.db,c),data); return r.id;
  },
  async set(c,id,data){
    if(!fb){ const d=demoLer(); d[c]=d[c]||{}; d[c][id]=Object.assign(d[c][id]||{},JSON.parse(JSON.stringify(data))); localStorage.setItem(DEMO_KEY,JSON.stringify(d)); return; }
    await fb.m.setDoc(fb.m.doc(fb.db,c,id),data,{merge:true});
  }
};
async function iniciarFirebase(){
  const base=`https://www.gstatic.com/firebasejs/${FBV}/`;
  const [a,au,m]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')]);
  const app=a.initializeApp(FIREBASE_CONFIG), auth=au.getAuth(app);
  if(!auth.currentUser) await au.signInAnonymously(auth);
  fb={m,db:m.getFirestore(app)};
}

/* ---------- faturas (mesma regra do app e do servidor) ---------- */
function valorHoje(p,ap){
  if(p.pago) return {valor:p.valor,dias:0,tipo:'pago'};
  const d=diasEntre(p.venc,hoje());
  if(d<0) return {valor:r2(p.valor*(1-(Number(ap.descontoPct)||0)/100)),dias:d,tipo:'antecipado'};
  if(d===0) return {valor:p.valor,dias:0,tipo:'hoje'};
  return {valor:r2(p.valor*(1+(Number(ap.multaPct)||0)/100+(Number(ap.moraDiaPct)||0)/100*d)),dias:d,tipo:'atraso'};
}
function quitacao(ap){
  const n=Number(ap.nParcelas)||(ap.parcelas||[]).length, fin=Number(ap.financiado)||0, principal=n?fin/n:0;
  let total=0, cheio=0;
  (ap.parcelas||[]).filter(p=>!p.pago).forEach(p=>{ const h=valorHoje(p,ap);
    const futura=diasEntre(p.venc,hoje())<0;
    if(futura&&principal>0){ total+=Math.min(principal,p.valor); cheio+=p.valor; }
    else if(futura){ total+=h.valor; cheio+=p.valor; }
    else { total+=h.valor; cheio+=h.valor; } });
  return {total:r2(total),desconto:r2(cheio-total)};
}
function etapas(ap){
  if(ap.etapaTotalDias!=null){ const t=Math.max(1,+ap.etapaTotalDias); return {parcial:Math.min(t,Math.max(1,+ap.etapaParcialDias||t)),total:t}; }
  const t=(Number(ap.toleranciaDias)||0)+1; return {parcial:t,total:t};
}
function situacao(ap){
  if(ap.roubo&&!ap.roubo.liberadoEm) return ['Roubo/perda comunicado — aparelho travado','red'];
  if(ap.quitado||ap.status==='QUITADO') return ['Contrato quitado','green'];
  if(ap.status==='CANCELADO') return ['Contrato encerrado','gray'];
  const atr=(ap.parcelas||[]).filter(p=>!p.pago&&diasEntre(p.venc,hoje())>0);
  if(atr.length){ const et=etapas(ap), maior=Math.max(...atr.map(p=>diasEntre(p.venc,hoje())));
    return [maior>=et.total?'Em atraso — aparelho bloqueado':maior>=et.parcial?'Em atraso — funções limitadas':`${atr.length} fatura(s) em atraso`,'red']; }
  return ['Faturas em dia','green'];
}

/* ---------- PIX (BR Code estático) ---------- */
const emv = (id,v) => id+String(v.length).padStart(2,'0')+v;
function crc16(s){ let c=0xFFFF; for(let i=0;i<s.length;i++){ c^=s.charCodeAt(i)<<8; for(let j=0;j<8;j++) c=(c&0x8000)?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF; } return c.toString(16).toUpperCase().padStart(4,'0'); }
function brcode(ap,valor,txid){
  const chave=String(ap.chavePix||'').trim(); if(!chave) return null;
  const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9 ]/g,'').toUpperCase().trim();
  let p=emv('00','01')+emv('26',emv('00','br.gov.bcb.pix')+emv('01',chave))+emv('52','0000')+emv('53','986')+emv('54',valor.toFixed(2))+emv('58','BR')
    +emv('59',norm(ap.recebedor||'NEXUMCELL').slice(0,25)||'NEXUMCELL')+emv('60',norm(ap.cidadeRecebedor||'FOZ DO IGUACU').slice(0,15)||'FOZ DO IGUACU')
    +emv('62',emv('05',String(txid||'***').replace(/[^A-Za-z0-9]/g,'').slice(0,25)||'***'))+'6304';
  return p+crc16(p);
}
async function pagar(tk,n,valor,descricao){
  const ap=S.aps[tk]; let codigo=null, auto=false, v=valor;

  if(n>0&&serv.startsWith('https://')){
    openModal('<p class="center"><span class="spin"></span> Gerando o PIX…</p>');
    try{ const r=await fetch(serv+'/api/pix',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:tk,n})}); if(r.ok){ const j=await r.json(); if(j.copiaECola){ codigo=j.copiaECola; v=j.valor||valor; auto=true; } } }catch(e){}
  }
  if(!codigo) codigo=brcode(ap,valor,`NXC${ap.vendaNumero}${n>0?'P'+n:'Q'}`);
  if(!codigo){ openModal('<h2>PIX indisponível</h2><p>A chave PIX ainda não foi cadastrada. Fale com o Suporte NexumCell pelo WhatsApp.</p>'+zapLoja(ap)); return; }
  let qr=''; try{ const q=qrcode(0,'M'); q.addData(codigo); q.make(); qr=q.createSvgTag({cellSize:4,margin:2,scalable:true}); }catch(e){}
  openModal(`<h2>Pagar com PIX</h2><p class="center" style="margin:0"><b style="font-size:26px">${brl(v)}</b><br><span class="muted">${esc(descricao)}</span></p>

    <p class="small muted">${auto?'O pagamento é confirmado sozinho: em poucos minutos a fatura aparece como paga e o aparelho é liberado.':'Abra o app do seu banco, escolha PIX copia e cola e cole o código. Depois envie o comprovante para o Suporte NexumCell.'}</p>`);
  $('#copiarPix').onclick=()=>navigator.clipboard?.writeText(codigo).then(()=>toast('Código copiado. Cole no app do banco.','ok'));
}

    const t=d<0?`Parcela ${p.n} em atraso`:d===0?`Parcela ${p.n} vence hoje`:`Parcela ${p.n} vence em ${d} dia${d>1?'s':''}`, corpo=`${brl(p.valor)} · ${ap.modelo||'seu celular'}. Pague com Pix pelo app NexumCell.`;

    ${!encerrado&&!roubo&&!ap.avaliado&&!localStorage.getItem('nxc_nps_'+tk)?`<div class="aviso warn" style="margin-top:14px"><b>Como foi o seu atendimento na compra?</b><div class="nps">${Array.from({length:11},(_,i)=>`<button data-nps="${tk}" data-n="${i}">${i}</button>`).join('')}</div><span class="small">0 = muito ruim · 10 = excelente</span></div>`:''}

function formRoubo(tk){
  const ap=S.aps[tk];
  openModal(`<h2>Comunicar roubo, furto ou perda</h2><p class="muted" style="margin-top:-4px">${esc(ap.marca+' '+ap.modelo)} · contrato nº ${esc(ap.vendaNumero)}</p>
    <div class="aviso warn">O aparelho será <b>travado</b> assim que se conectar à internet, para que ninguém consiga usá-lo. As parcelas continuam valendo normalmente.</div>
    <label>O que aconteceu?<select id="rTipo"><option>Roubo</option><option>Furto</option><option>Perda</option></select></label>
    <label>Quando?<input id="rData" type="date" value="${hoje()}" max="${hoje()}"></label>
    <label>Onde? (bairro, cidade)<input id="rLocal" maxlength="120"></label>
    <label>Número do boletim de ocorrência (se já tiver)<input id="rBo" maxlength="40"></label>
    <label>Conte o que aconteceu (opcional)<textarea id="rRelato" rows="2" maxlength="400"></textarea></label>
    <label class="check"><input type="checkbox" id="rOk"> <span>Confirmo que o aparelho não está comigo e quero que ele seja travado.</span></label>
    <label class="check"><input type="checkbox" id="rLoc"> <span>Autorizo a loja a localizar o aparelho enquanto ele estiver com comunicação de roubo ativa, para ajudar a recuperá-lo (pode informar à polícia).</span></label>
    <div class="erro" id="rMsg"></div>
    <button class="btn red full" id="rBtn">Comunicar e travar o aparelho</button>`);
  $('#rBtn').onclick=async()=>{
    if(!$('#rOk').checked) return $('#rMsg').textContent='Marque a confirmação.';
    if(!$('#rLocal').value.trim()) return $('#rMsg').textContent='Informe onde aconteceu.';
    $('#rBtn').disabled=true;
    const roubo={tipo:$('#rTipo').value,data:$('#rData').value||hoje(),local:$('#rLocal').value.trim(),bo:$('#rBo').value.trim(),relato:$('#rRelato').value.trim(),em:Date.now(),via:'PORTAL',localizar:$('#rLoc').checked};
    try{ await DB.set('aparelhos',tk,{roubo}); S.aps[tk].roubo=roubo;
      openModal(`<div class="center"><div class="ic ok">${svg('<path d="M20 6 9 17l-5-5"/>')}</div><h2>Comunicado recebido</h2><p>O aparelho será travado assim que se conectar à internet. A loja já foi avisada.</p></div>

      telaContratos();
    }catch(e){ console.error(e); $('#rMsg').textContent='Não foi possível enviar. Tente de novo ou fale com o Suporte NexumCell.'; $('#rBtn').disabled=false; }
  };
}

function pontos(ap){ const pp=Number(ap.pontosPorParcela)||0, ganhos=(ap.parcelas||[]).filter(p=>p.emDia).length*pp, saldo=Math.max(0,ganhos-(Number(ap.pontosUsados)||0));
  return {pp,saldo,reais:r2(saldo/100*(Number(ap.pontosValor)||0))}; }
function imprimir(titulo,corpo){

    <style>body{font-family:Georgia,serif;max-width:680px;margin:24px auto;padding:0 18px;color:#111;line-height:1.6}h1{font-family:Arial,sans-serif;font-size:19px;text-align:center}.cab{font-family:Arial,sans-serif;font-size:12px;color:#555;text-align:center;margin-bottom:18px}
    table{width:100%;border-collapse:collapse;margin:12px 0}td{border:1px solid #ccc;padding:8px;font-size:14px}@media print{button{display:none}}</style></head>
    <body>${corpo}<p style="text-align:center;margin-top:26px"><button onclick="print()" style="padding:10px 18px;font-size:15px">Salvar em PDF / imprimir</button></p></body></html>`;
  const w=window.open(URL.createObjectURL(new Blob([html],{type:'text/html'})),'_blank'); if(!w) toast('Permita abrir janelas para ver o comprovante','err');
}
function recibo(tk,n){

function respostaLocal(txt){
  const t=normNome(txt), aps=Object.values(S.aps), ap=aps[0]; if(!ap) return 'Entre com seus dados para eu consultar seu contrato.';
  const ab=(ap.parcelas||[]).filter(p=>!p.pago), atr=ab.filter(p=>diasEntre(p.venc,hoje())>0), prox=ab[0];
  const soma=atr.reduce((s,p)=>s+valorHoje(p,ap).valor,0);
  if(/DEVO|DIVIDA|ATRAS|DEBITO|EM ABERTO/.test(t)) return atr.length?`Você tem ${atr.length} parcela(s) em atraso, que hoje somam ${brl(soma)} já com multa e juros. Toque em “Pagar” na parcela para gerar o PIX.`:`Você está em dia! ${prox?`A próxima parcela (${prox.n}) vence ${fmtD(prox.venc)}: ${brl(valorHoje(prox,ap).valor)} pagando até lá.`:''}`;
  if(/PIX|PAGAR|PAGAMENTO|BOLETO|CHAVE/.test(t)) return prox?`Para pagar, toque em “Pagar” na parcela ${prox.n} aqui em cima: aparece o QR code e o código PIX copia e cola. ${ap.chavePix?'A chave PIX da loja é '+ap.chavePix+'.':''}`:'Seu contrato não tem parcelas em aberto.';
  if(/VENC|QUANDO|DATA|DIA/.test(t)) return prox?`A parcela ${prox.n} vence ${fmtD(prox.venc)}. Pagando antes, você ganha ${Number(ap.descontoPct)||0}% de desconto. Se quiser mudar o dia do vencimento, use o botão “Mudar dia do vencimento”.`:'Não há parcelas em aberto.';
  if(/QUIT|ANTECIP|ADIANT|TERMINAR|FINALIZAR/.test(t)){ const q=quitacao(ap); return ab.length?`Para quitar hoje, o valor é ${brl(q.total)} (economia de ${brl(q.desconto)}). Use o botão “Quitar com PIX”.`:'Seu contrato já está quitado. Você pode baixar o termo de quitação aqui no portal.'; }
  if(/BLOQUE|TRAV|LIBER|DESBLOQ/.test(t)) return atr.length?`O aparelho é limitado ou bloqueado quando há parcela em atraso. Pague ${brl(soma)} e ele é liberado sozinho em poucos minutos (ou toque em “Já paguei — verificar” no celular). Na tela de bloqueio também existe a liberação de 24 h, uma vez por mês.`:'Seu contrato está em dia, então o aparelho não deve estar bloqueado. Se estiver, abra o NexumCell no celular e toque em “Já paguei — verificar” com a internet ligada.';
  if(/PONTO/.test(t)){ const pt=pontos(ap); return `Você tem ${pt.saldo} pontos (${brl(pt.reais)}). Use na loja como desconto em acessórios ou no próximo celular.`; }
  if(/ROUB|FURT|PERD/.test(t)) return 'Sinto muito! Toque em “Roubo, furto ou perda” no seu contrato: o aparelho é travado e mostramos o passo a passo do boletim e do bloqueio do IMEI.';
  if(/DEFEIT|QUEBR|CONSERT|GARANT|TELA/.test(t)) return 'Toque em “Meu aparelho deu defeito” e descreva o problema. O Suporte NexumCell responde por aqui e pelo WhatsApp.';
  if(/ATENDENTE|PESSOA|HUMANO|LOJA|WHATS|FALAR/.test(t)){ const nx=NX_WHATS(), fmt=nx.replace(/^55(\d{2})(\d{5})(\d{4})$/,'($1) $2-$3'); return `Claro! Toque no botão “Falar com o Suporte NexumCell” no seu contrato${nx?' ou chame no WhatsApp '+fmt:''}. O atendimento é sempre com a NexumCell.`; }
  return null;
}

function fotoReduzida(file,max=1100,q=0.7){ return new Promise((ok,er)=>{ const fr=new FileReader(); fr.onload=()=>{ const im=new Image(); im.onload=()=>{ let w=im.width,h=im.height; const k=Math.min(1,max/Math.max(w,h)); w=Math.round(w*k); h=Math.round(h*k);
  const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(im,0,0,w,h); let d=c.toDataURL('image/jpeg',q); if(d.length>300000) d=c.toDataURL('image/jpeg',0.5); ok(d); }; im.onerror=()=>er(new Error('Imagem inválida')); im.src=fr.result; }; fr.onerror=er; fr.readAsDataURL(file); }); }

    document.querySelectorAll('[data-ft]').forEach(inp=>inp.addEventListener('change',async()=>{ const k=inp.dataset.ft, f=inp.files[0]; if(!f) return;
      try{ F[k]=await fotoReduzida(f); guardar(); des(); }catch(e){ toast('Não foi possível ler a foto. Tente de novo.','err'); } }));
    document.querySelectorAll('[data-fone]').forEach(i=>i.addEventListener('input',()=>{ i.value=fone(i.value); }));
    $('#cpf')?.addEventListener('input',e=>{ const d=onlyDig(e.target.value).slice(0,11); e.target.value=d.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2'); });
    $('#cep')?.addEventListener('input',async e=>{ const c=onlyDig(e.target.value).slice(0,8); e.target.value=c.replace(/(\d{5})(\d)/,'$1-$2'); if(c.length!==8) return;
      try{ const r=await (await fetch(`https://viacep.com.br/ws/${c}/json/`)).json(); if(r.erro) return; if(!$('#endereco').value) $('#endereco').value=r.logradouro?r.logradouro+', ':''; if(r.bairro) $('#bairro').value=r.bairro; if(r.localidade) $('#cidade').value=r.localidade; if(r.uf) $('#uf').value=r.uf; }catch(_){} });
    $('#rSelfieDeNovo')?.addEventListener('click',()=>{ delete F.selfie; delete F.mosaico; delete D.vidaMov; des(); });
    if(passo===2&&!F.selfie){ const vid=$('#rVid');
      navigator.mediaDevices?.getUserMedia({video:{facingMode:'user',width:{ideal:1280}},audio:false}).then(s=>{ if(passo!==2||!$('#rVid')){ s.getTracks().forEach(t=>t.stop()); return; } stream=s; vid.srcObject=s; })
        .catch(()=>{ $('#rCam').hidden=true; $('#rFoto').hidden=true; $('#rAlt').hidden=false; });
      if(!navigator.mediaDevices){ $('#rCam').hidden=true; $('#rFoto').hidden=true; $('#rAlt').hidden=false; }
      $('#rFoto').onclick=async()=>{ if(!vid.videoWidth) return $('#rMsg').textContent='A câmera ainda não está pronta. Aguarde um instante.';
        // prova de vida: 3 quadros com instrução (olhar, virar, sorrir); sem movimento = pode ser foto de foto
        const bt=$('#rFoto'), ps=$('#rPasso'); bt.disabled=true; $('#rMsg').textContent='';
        const quadro=()=>{ const k=Math.min(1,900/Math.max(vid.videoWidth,vid.videoHeight)), cv=document.createElement('canvas'); cv.width=Math.round(vid.videoWidth*k); cv.height=Math.round(vid.videoHeight*k); const x=cv.getContext('2d'); x.translate(cv.width,0); x.scale(-1,1); x.drawImage(vid,0,0,cv.width,cv.height); return cv; };
        const cinza=cv=>{ const W=64,H=48,t=document.createElement('canvas'); t.width=W; t.height=H; t.getContext('2d').drawImage(cv,cv.width*0.25,cv.height*0.1,cv.width*0.5,cv.height*0.8,0,0,W,H); const d=t.getContext('2d').getImageData(0,0,W,H).data,o=[]; for(let i=0;i<d.length;i+=4) o.push((d[i]+d[i+1]+d[i+2])/3); return o; };
        const dif=(a,b)=>{ const x=cinza(a),y=cinza(b); let s=0; for(let i=0;i<x.length;i++) s+=Math.abs(x[i]-y[i]); return s/x.length; };
        const qs=[]; for(const tx of ['Olhe para a câmera','Vire o rosto devagar para o lado','Agora sorria']){ ps.textContent=tx; await new Promise(o=>setTimeout(o,1700)); if(!$('#rVid')) return; qs.push(quadro()); }
        ps.textContent=''; const mov=Math.max(dif(qs[0],qs[1]),dif(qs[0],qs[2]));
        if(mov<=4){ $('#rMsg').textContent='O rosto não se mexeu. Toque de novo e siga as instruções que aparecem na tela.'; bt.disabled=false; return; }
        const h=220, ws=qs.map(q=>Math.round(q.width*h/q.height)), m=document.createElement('canvas'); m.width=ws.reduce((a,b)=>a+b,0); m.height=h; const mx=m.getContext('2d'); let px=0; qs.forEach((q,i)=>{ mx.drawImage(q,px,0,ws[i],h); px+=ws[i]; });
        F.selfie=qs[0].toDataURL('image/jpeg',0.82); F.mosaico=m.toDataURL('image/jpeg',0.7); D.vidaMov=Math.round(mov*10)/10; des(); }; }
  };
  des();
}

    button{padding:10px 16px;margin:10px 0;font-size:15px}@media print{button{display:none}}</style></head><body>

async function telaBio(tk){

  const b=DEMO?{status:'PENDENTE',expiraEm:Date.now()+9e5,empresa:'Loja demonstração'}:await DB.get('bios',tk).catch(()=>null);
  if(!b) return tela('QR Code inválido','Peça para o vendedor gerar um novo QR Code.');
  if(b.status!=='PENDENTE') return tela('Biometria já enviada','Pode voltar para o atendimento na loja.',true);
  if(Date.now()>b.expiraEm) return tela('QR Code vencido','Peça para o vendedor gerar um novo QR Code.');
  $('#app').innerHTML=`<div class="card"><h2>Biometria facial</h2><p class="muted">${esc(b.empresa||'')} · Tire óculos escuros e boné e fique em um lugar claro. Toque em <b>Começar</b> e siga as instruções: olhar para a câmera, virar o rosto e sorrir.</p>
    <div id="bCam" style="position:relative;border-radius:18px;overflow:hidden;background:#000;aspect-ratio:3/4;max-width:420px;margin:0 auto">
      <video id="bVid" playsinline autoplay muted style="width:100%;height:100%;object-fit:cover;display:block;transform:scaleX(-1)"></video>
      <div style="position:absolute;inset:12% 18% 18%;border:3px dashed rgba(255,255,255,.85);border-radius:50%;box-shadow:0 0 0 999px rgba(10,23,51,.35)"></div>
      <div id="bPasso" style="position:absolute;left:0;right:0;bottom:12px;text-align:center;font-size:20px;font-weight:700;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.7)"></div></div>
    <button class="btn pri full" id="bIr" style="margin-top:14px">Começar</button>
    <label class="btn full" id="bAlt" style="margin-top:10px;text-align:center;cursor:pointer" hidden>${rmI('cam')} Abrir a câmera do celular<input type="file" accept="image/*" capture="user" id="bArq" hidden></label>
    <p class="small" id="bMsg" style="color:#c0392b;text-align:center;min-height:18px"></p></div>`;
  const vid=$('#bVid'), msg=$('#bMsg'); let stream=null;
  const parar=()=>{ try{ stream&&stream.getTracks().forEach(t=>t.stop()); }catch(e){} };
  try{ stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280}},audio:false}); vid.srcObject=stream; }
  catch(e){ msg.textContent='Não foi possível abrir a câmera aqui. Use o botão abaixo.'; $('#bIr').hidden=true; $('#bAlt').hidden=false; }
  const quadro=()=>{ const c=document.createElement('canvas'); c.width=vid.videoWidth; c.height=vid.videoHeight; const x=c.getContext('2d'); x.translate(c.width,0); x.scale(-1,1); x.drawImage(vid,0,0); return c; };
  const dif=(a,b)=>{ const W=64,H=48, g=c=>{ const t=document.createElement('canvas'); t.width=W; t.height=H; t.getContext('2d').drawImage(c,c.width*0.25,c.height*0.1,c.width*0.5,c.height*0.8,0,0,W,H); const d=t.getContext('2d').getImageData(0,0,W,H).data, o=[]; for(let i=0;i<d.length;i+=4) o.push((d[i]+d[i+1]+d[i+2])/3); return o; }; const x=g(a), y=g(b); let s=0; for(let i=0;i<x.length;i++) s+=Math.abs(x[i]-y[i]); return s/x.length; };
  // reduz até caber no limite (iPhone gera fotos bem pesadas)
  const menor=(c,max,q,lim=280000)=>{ let out=''; for(let k=0;k<6;k++){ const e=Math.min(1,max/Math.max(c.width,c.height)), t=document.createElement('canvas'); t.width=Math.round(c.width*e); t.height=Math.round(c.height*e); t.getContext('2d').drawImage(c,0,0,t.width,t.height); out=t.toDataURL('image/jpeg',q); if(out.length<lim) break; max=Math.round(max*0.82); q=Math.max(0.5,q-0.08); } return out; };
  const enviar=async(selfie,mosaico,mov)=>{ msg.style.color=''; msg.textContent='Enviando…';
    if(!DEMO&&Date.now()>b.expiraEm){ parar(); return tela('QR Code vencido','Passou o tempo do QR Code. Peça para o vendedor gerar um novo.'); }
    const dados={status:'ENVIADA',selfie,mosaico:mosaico||'',mov,enviadaEm:Date.now(),dispositivo:navigator.userAgent.slice(0,180)};
    for(let t=0;t<2;t++){
      try{ if(!DEMO) await DB.set('bios',tk,dados);
        parar(); return tela('Biometria enviada!','Pronto. Pode voltar para o atendimento: a foto já apareceu na tela do vendedor.'+(DEMO?' (demonstração: nada foi enviado)':''),true);
      }catch(e){ console.warn('bios',e.code,e.message);
        if(t===0&&/permission|denied|insufficient/i.test(String(e.code||e.message))){ dados.mosaico=''; continue; }   // tenta de novo só com a selfie
        msg.style.color='#c0392b';
        msg.textContent=/permission|denied|insufficient/i.test(String(e.code||e.message))?'O QR Code não aceita mais o envio (vencido ou já usado). Peça um novo ao vendedor.':'Não foi possível enviar. Verifique a internet e tente de novo.';
        $('#bIr').disabled=false; return; } } };
  $('#bIr').onclick=async()=>{ if(!vid.videoWidth) return msg.textContent='A câmera ainda não está pronta.';
    $('#bIr').disabled=true; msg.textContent=''; const qs=[];
    for(const p of ['Olhe para a câmera','Vire o rosto devagar para o lado','Agora sorria']){ $('#bPasso').textContent=p; await new Promise(o=>setTimeout(o,1700)); qs.push(quadro()); }
    $('#bPasso').textContent='';
    const mov=Math.max(dif(qs[0],qs[1]),dif(qs[0],qs[2]));
    if(mov<=4){ msg.textContent='O rosto não se mexeu. Toque em Começar e siga as instruções na tela.'; $('#bIr').disabled=false; return; }
    const h=220, ws=qs.map(c=>Math.round(c.width*h/c.height)), m=document.createElement('canvas'); m.width=ws.reduce((a,b)=>a+b,0); m.height=h; const mx=m.getContext('2d'); let px=0; qs.forEach((c,i)=>{ mx.drawImage(c,px,0,ws[i],h); px+=ws[i]; });
    await enviar(menor(qs[0],900,0.82),menor(m,1400,0.72,300000),Math.round(mov*10)/10);
  };
  $('#bArq').onchange=async e=>{ const f=e.target.files[0]; if(!f) return; if(Date.now()-f.lastModified>120000) return msg.textContent='Use uma foto tirada agora, não da galeria.';
    const img=new Image(); img.onload=()=>{ const c=document.createElement('canvas'); c.width=img.naturalWidth; c.height=img.naturalHeight; c.getContext('2d').drawImage(img,0,0); enviar(menor(c,900,0.82),'',null); }; img.src=URL.createObjectURL(f); };
}

/* ---------- central de avisos ---------- */
function avisos3(aps){
  const l=[], h=hoje();
  aps.forEach(ap=>{ const ab=(ap.parcelas||[]).filter(p=>!p.pago);
    if(rouboAp(ap)) l.push({k:ap.id+'rb',imp:1,ic:'alerta',c:'r',t:`${ap.modelo||'Aparelho'} travado por ${String(ap.roubo.tipo||'roubo').toLowerCase()}`,s:fmtDT(ap.roubo.em)});
    ab.forEach(p=>{ const d=diasEntre(p.venc,h); if(encAp(ap)) return;
      if(d>0) l.push({k:ap.id+'a'+p.n+h,imp:1,ic:'alerta',c:'r',t:`Parcela ${p.n} atrasada há ${d} dia(s)`,s:`${brl(valorHoje(p,ap).valor)} com multa e juros`,a:`data-pagar="${ap.id}" data-n="${p.n}" data-v="${valorHoje(p,ap).valor}"`});
      else if(d>=-5) l.push({k:ap.id+'v'+p.n,imp:1,ic:'cal',c:'w',t:d===0?`Parcela ${p.n} vence hoje`:`Parcela ${p.n} vence em ${-d} dia(s)`,s:`${brl(p.valor)} · ${fmtD(p.venc)}`,a:`data-pagar="${ap.id}" data-n="${p.n}" data-v="${valorHoje(p,ap).valor}"`}); });
    (ap.parcelas||[]).filter(p=>p.pago&&p.pagoEm&&diasEntre(p.pagoEm,h)<=30).forEach(p=>l.push({k:ap.id+'p'+p.n,ic:'check',c:'ok',t:`Pagamento da parcela ${p.n} confirmado`,s:`${brl(p.valorPago??p.valor)} em ${fmtD(p.pagoEm)}`,a:`data-recibo="${ap.id}" data-n="${p.n}"`}));
    if(ap.promessaApp&&ap.liberadoAte>Date.now()) l.push({k:ap.id+'pr',ic:'relogio',c:'b',t:`Promessa de pagamento até ${fmtD(ap.promessaApp.data)}`,s:brl(ap.promessaApp.valor)});
    Object.values(ap.pedidos||{}).filter(x=>x.resposta).forEach((x,i)=>l.push({k:ap.id+'pd'+(x.criadoEm||i)+String(x.resposta).length,imp:1,ic:'ajuda',c:'b',t:`Resposta: ${PED_TIPO[x.tipo]||x.tipo||'pedido'}`,s:x.resposta}));
    if(ap.preAprovado) l.push({k:ap.id+'pa',ic:'estrela',c:'b',t:'Crédito pré-aprovado para trocar de celular',s:ap.preAprovado.valor?'Até '+brl(ap.preAprovado.valor):''}); });
  return l;
}

  openModal(`<h2>Avisos</h2>${l.length?`<div class="avl3">${l.map(a=>`<${a.a?'button':'div'} class="av3i" ${a.a||''}><span class="op3-ic ${a.c}">${i3(a.ic)}</span><span class="op3-t">${esc(a.t)}${a.s?`<small>${esc(a.s)}</small>`:''}</span>${!avVisto(a)&&a.imp?'<i class="nv3"></i>':''}</${a.a?'button':'div'}>`).join('')}</div>`:'<p class="vazio3">Nenhum aviso por enquanto.</p>'}`);
  try{ const v=JSON.parse(localStorage.getItem('nxc_avv')||'{}'); l.forEach(a=>v[a.k]=1); localStorage.setItem('nxc_avv',JSON.stringify(v)); }catch(e){}
  $('.h3-bell')?.classList.remove('dot'); $('.h3-bell i')?.remove();
}

/* ---------- perfil, biometria e "lembrar neste celular" ---------- */
const LEMB=()=>{ try{ return JSON.parse(localStorage.getItem('nxc_lemb')||'null'); }catch(e){ return null; } };
const b64=u=>btoa(String.fromCharCode(...new Uint8Array(u))), deB64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const bioDisp=async()=>{ try{ return !!(window.PublicKeyCredential&&await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()); }catch(e){ return false; } };
async function bioCriar(){
  const c=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'NexumCell'},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'cliente',displayName:pNome(S._aps?.[0]?.clienteNome)},
    pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'discouraged'},timeout:60000}});
  return b64(c.rawId);
}
async function bioConfere(id){ await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:'public-key',id:deB64(id)}],userVerification:'required',timeout:60000}}); return true; }
function salvarLemb(extra={}){ const a=S._aps?.[0]; const atual=LEMB()||{}; localStorage.setItem('nxc_lemb',JSON.stringify({...atual,tokens:S.tokens,nome:a?.clienteNome||atual.nome||'',...extra})); }
async function abrirPerfil3(){
  const a=S._aps[0], lb=LEMB(), bio=await bioDisp();
  openModal(`<div class="pf3"><span class="av3 g">${esc(iniNome(a.clienteNome))}</span><b>${esc(a.clienteNome||'')}</b><small>${S._aps.length} contrato(s) · cliente desde ${a.criadoEm?new Date(Math.min(...S._aps.map(x=>x.criadoEm||Date.now()))).getFullYear():''}</small></div>
    <div class="ops3 card3">
      <button class="op3" data-nxlemb="1"><span class="op3-ic">${i3('cel')}</span><span class="op3-t">Lembrar neste celular<small>${lb?'Ligado: entra sem digitar os dados':'Desligado: pede CPF, nascimento e celular'}</small></span><span class="sw3 ${lb?'on':''}"><i></i></span></button>
      ${bio?`<button class="op3" data-nxbio="1"><span class="op3-ic">${i3('face')}</span><span class="op3-t">Entrar com biometria<small>${lb?.bio?'Ligado: digital ou rosto para abrir':'Use a digital ou o rosto do celular'}</small></span><span class="sw3 ${lb?.bio?'on':''}"><i></i></span></button>`:''}
      ${'Notification' in window?`<button class="op3" data-avisoson="1"><span class="op3-ic">${i3('sino')}</span><span class="op3-t">Avisos de vencimento<small>${Notification.permission==='granted'?'Ligados':Notification.permission==='denied'?'Bloqueados no navegador':'Toque para ligar'}</small></span>${i3('chev','ch')}</button>`:''}
      <button class="op3" data-nxlang="1"><span class="op3-ic">${i3('globo')}</span><span class="op3-t">Idioma<small>${LANG==='es'?'Español':'Português'}</small></span>${i3('chev','ch')}</button>
      <a class="op3" href="termos.html" target="_blank" rel="noopener"><span class="op3-ic">${i3('doc')}</span><span class="op3-t">Termos de uso</span>${i3('chev','ch')}</a>
      <a class="op3" href="privacidade.html" target="_blank" rel="noopener"><span class="op3-ic">${i3('cadeado')}</span><span class="op3-t">Privacidade</span>${i3('chev','ch')}</a>
      <button class="op3 dg" data-nxsair="1"><span class="op3-ic">${i3('sair')}</span><span class="op3-t">Sair</span></button></div>`);
}

/* ---------- login novo ---------- */
telaLogin=function(msg=''){
  document.body.classList.add('nx3'); document.body.classList.remove('tab-ajuda'); $('#sair').hidden=true; $('#chatBtn')?.remove();
  const lb=LEMB();
  $('#app').innerHTML=`<div class="lg3"><div class="lg3-top"><div class="lg3-bar"><img src="${LOGO3()}" alt="NexumCell"><button type="button" data-nxlang="1">${LANG==='es'?'Português':'Español'}</button></div>
    <h1>Seu celular,<br>suas parcelas,<br><em>tudo em dia.</em></h1><p>Pague por PIX, veja o contrato e fale com a gente sem sair do app.</p></div>
    <div class="lg3-box">${lb?`<div class="lb3"><span class="av3 g">${esc(iniNome(lb.nome))}</span><div><b>${esc(pNome(lb.nome))}</b><small>Conta lembrada neste celular</small></div></div>
      <button class="b3 pri full" id="lbEntrar">${lb.bio?i3('face'):''}${lb.bio?'Entrar com biometria':'Entrar'}</button><div class="erro" id="lMsg">${esc(msg)}</div>
      <button class="lnk" id="lbOutro" type="button">Entrar com outra conta</button>`:`<form id="fLogin" autocomplete="on"><h2>Entrar</h2><p class="sub3">Use os dados da sua compra</p>
      <label class="fl3"><span>CPF</span><input id="lCpf" inputmode="numeric" autocomplete="off" placeholder="000.000.000-00" required></label>
      <label class="fl3"><span>Data de nascimento</span><input id="lNasc" type="date" required></label>
      <label class="fl3"><span>4 últimos dígitos do celular cadastrado na compra</span><input id="lTel" inputmode="numeric" maxlength="4" placeholder="0000" required></label>
      <label class="ck3"><input type="checkbox" id="lLemb"><span>Lembrar neste celular</span></label>
      <div class="erro" id="lMsg">${esc(msg)}</div><button class="b3 pri full" id="lBtn">Entrar</button></form>`}
      <a class="pre3" href="?pre${DEMO?'&demo':''}">${i3('cel')}<span><b>Ainda não é cliente?</b>Faça a pré-análise grátis pelo celular</span>${i3('chev','ch')}</a>
      <p class="seg3t">${i3('cadeado')}Conexão protegida · <a href="termos.html" target="_blank">Termos</a> · <a href="privacidade.html" target="_blank">Privacidade</a></p></div></div>`;
  if(lb){ $('#lbOutro').onclick=()=>{ localStorage.removeItem('nxc_lemb'); telaLogin(); };
    $('#lbEntrar').onclick=async()=>{ const b=$('#lbEntrar'); b.disabled=true;
      try{ if(lb.bio) await bioConfere(lb.bio); S.tokens=lb.tokens||[]; sessionStorage.setItem('nxc_cli',JSON.stringify(S.tokens)); await telaContratos(); }
      catch(e){ b.disabled=false; $('#lMsg').textContent=lb.bio?'A biometria não foi confirmada. Tente de novo ou entre com outra conta.':'Não foi possível entrar agora.'; } };
    return; }
  $('#lCpf').addEventListener('input',e=>{ const d=onlyDig(e.target.value).slice(0,11); e.target.value=d.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2'); });
  $('#fLogin').addEventListener('submit',e=>{ e.preventDefault(); entrar(); });
};
{ const _en=entrar; entrar=async function(){ const lemb=$('#lLemb')?.checked; await _en(); if(lemb&&S.tokens.length){ salvarLemb(); if(await bioDisp()) setTimeout(()=>toast('Dica: ligue "Entrar com biometria" no seu perfil (toque na sua foto).','ok'),1200); } }; }
{ const _tc=telaContratos; telaContratos=async function(){ S._carregado=Date.now(); const r=await _tc(); if(S._aps?.length&&LEMB()) salvarLemb(); return r; }; }

/* ---------- PIX: folha de baixo e confirmação automática ---------- */
{ const _pg=pagar; pagar=async function(tk,n,valor,desc){ await _pg(tk,n,valor,desc); $('#mbody')?.classList.add('pix3'); vigiar3(tk,n); }; }
function vigiar3(tk,n){
  clearInterval(S._vig); const ini=Date.now();
  S._vig=setInterval(async()=>{ if($('#modal').hidden||Date.now()-ini>20*60e3) return clearInterval(S._vig);
    const ap=await DB.get('aparelhos',tk).catch(()=>null); if(!ap) return;
    const ok=n>0?(ap.parcelas||[]).find(p=>+p.n===+n)?.pago:(ap.quitado||ap.status==='QUITADO'); if(!ok) return;
    clearInterval(S._vig); S.aps[tk]=ap; S._aps=S._aps.map(a=>a.id===tk?ap:a); S._carregado=Date.now();
    openModal(`<div class="okp3"><div class="okp3-ic">${i3('check')}</div><h2>Pagamento confirmado</h2><p>${n>0?`Parcela ${n} paga.`:'Contrato quitado. Parabéns!'} ${rouboAp(ap)?'':'Se o celular estava limitado, ele libera em até 1 minuto.'}</p>
      ${n>0?`<button class="b3 sec full" data-recibo="${tk}" data-n="${n}">${i3('doc')}Ver recibo</button>`:`<button class="b3 sec full" data-termo="${tk}">${i3('doc')}Termo de quitação</button>`}<button class="b3 pri full" data-nxfechar="1" style="margin-top:8px">Concluir</button></div>`);
    renderTabBanco(CLI_TAB); }, 6000);
}

/* ---------- vencimentos na agenda do celular (.ics) ---------- */
function agenda3(){
  const ev=[], d8=s=>String(s).replace(/-/g,''); (S._aps||[]).filter(a=>!encAp(a)).forEach(ap=>(ap.parcelas||[]).filter(p=>!p.pago).forEach(p=>ev.push(
    `BEGIN:VEVENT\r\nUID:nxc-${ap.id}-${p.n}@nexumcell\r\nDTSTAMP:${new Date().toISOString().replace(/[-:]/g,'').slice(0,15)}Z\r\nDTSTART;VALUE=DATE:${d8(p.venc)}\r\nSUMMARY:Parcela ${p.n} NexumCell - ${brl(p.valor)}\r\nDESCRIPTION:${(ap.marca||'')+' '+(ap.modelo||'')} · contrato ${ap.vendaNumero}. Pague com PIX pelo app NexumCell.\r\nBEGIN:VALARM\r\nTRIGGER:-P1D\r\nACTION:DISPLAY\r\nDESCRIPTION:Parcela NexumCell vence amanhã\r\nEND:VALARM\r\nEND:VEVENT`)));
  if(!ev.length) return toast('Nenhuma parcela em aberto para lembrar','ok');
  const blob=new Blob([`BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//NexumCell//Cliente//PT\r\n${ev.join('\r\n')}\r\nEND:VCALENDAR`],{type:'text/calendar'}), a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='vencimentos-nexumcell.ics'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast(`${ev.length} vencimento(s) prontos: abra o arquivo para pôr na agenda (com aviso 1 dia antes)`,'ok');
}

/* ---------- atualiza sozinho ao voltar para o app ---------- */
async function recarregar3(silencio){
  if(!S.tokens?.length||!$('#bkBody')) return; const aps=(await Promise.all(S.tokens.map(tk=>DB.get('aparelhos',tk).catch(()=>null)))).filter(Boolean); if(!aps.length) return;
  aps.sort((a,b)=>(b.criadoEm||0)-(a.criadoEm||0)); S._aps=aps; S.aps={}; aps.forEach(a=>S.aps[a.id]=a); S._carregado=Date.now();
  if($('#bkBody')&&$('#bkBody').className.startsWith('tab3')&&$('#modal').hidden&&CLI_TAB!=='ajuda') renderTabBanco(CLI_TAB); if(!silencio) toast('Atualizado','ok');
}
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&Date.now()-(S._carregado||0)>60e3) recarregar3(true); });

document.addEventListener('click',async e=>{
  const t=e.target.closest?.('[data-nxap],[data-nxseg],[data-nxperfil],[data-nxavisos],[data-nxagenda],[data-nxlink],[data-nxlemb],[data-nxbio],[data-nxlang],[data-nxsair],[data-nxfechar],[data-nxatualizar]'); if(!t) return;
  const d=t.dataset;
  if(d.nxap){ AP_SEL=d.nxap; renderTabBanco('aparelho'); }
  else if(d.nxseg){ F3.seg=d.nxseg; renderTabBanco('faturas'); }
  else if(d.nxperfil) abrirPerfil3();
  else if(d.nxavisos) abrirAvisos3();
  else if(d.nxagenda) agenda3();
  else if(d.nxlink) window.open(d.nxlink,'_blank','noopener');
  else if(d.nxatualizar) recarregar3();
  else if(d.nxfechar) closeModal();
  else if(d.nxlang){ LANG=LANG==='es'?'pt':'es'; try{ localStorage.setItem('nxc_lang',LANG); }catch(er){} location.reload(); }
  else if(d.nxsair){ closeModal(); clearInterval(S._vig); sessionStorage.removeItem('nxc_cli'); S.tokens=[]; CLI_TAB='inicio'; telaLogin(); }
  else if(d.nxlemb){ if(LEMB()){ localStorage.removeItem('nxc_lemb'); toast('Este celular não lembra mais a sua conta'); } else { salvarLemb(); toast('Pronto: na próxima vez você entra com um toque','ok'); } abrirPerfil3(); }
  else if(d.nxbio){ const lb=LEMB();
    if(lb?.bio){ salvarLemb({bio:null}); toast('Biometria desligada'); return abrirPerfil3(); }
    try{ const id=await bioCriar(); salvarLemb({bio:id}); toast('Biometria ligada: na próxima vez é só usar a digital ou o rosto','ok'); }catch(er){ toast('Não foi possível ligar a biometria neste celular','err'); }
    abrirPerfil3(); }
});

/* ---------- eventos e início ---------- */
document.addEventListener('click',e=>{
  const _tb=e.target.closest('[data-tabbk]'); if(_tb){ renderTabBanco(_tb.dataset.tabbk); return; }
  const _ab=e.target.closest('[data-abrir]'); if(_ab){ abrirAparelhoBk(_ab.dataset.abrir); return; }
  const _vb=e.target.closest('[data-voltarbk]'); if(_vb){ renderBanco(); return; }
  const cp=e.target.closest('[data-copy]'); if(cp){ try{ navigator.clipboard.writeText(decodeURIComponent(cp.dataset.copy)); toast('Código copiado','ok'); }catch(err){} return; }
  const op=e.target.closest('[data-outrem]'); if(op){ pagarPorOutro(op.dataset.outrem,+op.dataset.n,+op.dataset.v); return; }
  const p=e.target.closest('[data-pagar]'); if(p){ const n=+p.dataset.n; pagar(p.dataset.pagar,n,+p.dataset.v,n>0?`Parcela ${n} · contrato nº ${S.aps[p.dataset.pagar].vendaNumero}`:`Quitação do contrato nº ${S.aps[p.dataset.pagar].vendaNumero}`); return; }
  const r=e.target.closest('[data-roubo]'); if(r){ formRoubo(r.dataset.roubo); return; }
  const pd=e.target.closest('[data-pedido]'); if(pd){ formPedido(pd.dataset.pedido,pd.dataset.tipo); return; }
  const pm=e.target.closest('[data-promessa]'); if(pm){ formPromessa(pm.dataset.promessa); return; }
  const cn=e.target.closest('[data-carne]'); if(cn){ carne(cn.dataset.carne); return; }
  const ac=e.target.closest('[data-acordo]'); if(ac){ formAcordo(ac.dataset.acordo); return; }
  const up=e.target.closest('[data-upgrade]'); if(up){ formUpgrade(up.dataset.upgrade); return; }
  const rc=e.target.closest('[data-recibo]'); if(rc){ recibo(rc.dataset.recibo,+rc.dataset.n); return; }
  const pa=e.target.closest('[data-pixauto]'); if(pa){ ativarPixAutomatico(pa.dataset.pixauto); return; }
  const np=e.target.closest('[data-nps]'); if(np){ formNps(np.dataset.nps,+np.dataset.n); return; }
  const tm=e.target.closest('[data-termo]'); if(tm){ termo(tm.dataset.termo); return; }
  const q=e.target.closest('[data-q]'); if(q){ perguntar(q.dataset.q); return; }
  if(e.target.closest('#chatBtn')){ $('#chatBtn').classList.add('visto'); try{ sessionStorage.setItem('nxc_chatv','1'); }catch(er){} abrirChat(); }
});
$('#sair').onclick=()=>{ $('#chatBtn')?.remove(); sessionStorage.removeItem('nxc_cli'); S.tokens=[]; telaLogin(); };
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
(async()=>{
  try{ if(FB_ON) await iniciarFirebase(); }
  catch(e){ console.error(e); $('#app').innerHTML='<div class="card center"><h2>Sem conexão</h2><p class="muted">Verifique a internet e recarregue a página.</p></div>'; return; }
  if(!FB_ON&&!DEMO){ $('#app').innerHTML='<div class="card center"><h2>Portal em configuração</h2><p class="muted">Volte mais tarde.</p></div>'; return; }
  const qs=new URLSearchParams(location.search), tk=qs.get('assinar');
  if(tk) return telaAssinar(tk);
  if(qs.has('pre')) return telaPre(qs.get('pre'));
  if(qs.get('bio')) return telaBio(qs.get('bio'));
  if(qs.get('vid')) return telaVideo(qs.get('vid'));
  if(qs.get('remoto')) return telaRemota(qs.get('remoto'));
  if(qs.get('instalar')) return telaInstalar(qs.get('instalar'));
  if(qs.get('contrato')) return telaContrato(qs.get('contrato'));
  try{ S.tokens=JSON.parse(sessionStorage.getItem('nxc_cli'))||[]; }catch(e){ S.tokens=[]; }
  if(S.tokens.length) await telaContratos(); else telaLogin();
  traduzirNo(document.body);
})();
