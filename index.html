<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A1733">
<title>Minha conta — NexumCell</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png">
<script src="nexumcell-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style>
:root{--ink:#0A1733;--ink2:#13244D;--bg:#F4F4F8;--card:#fff;--line:#E2E1EC;--txt:#1B1A2E;--mut:#696784;--pri:#1A5CFF;--pri-s:#E8F0FF;--gold:#E2B33B;
  --ok:#0E8A5F;--ok-s:#E3F4EC;--warn:#A86A12;--warn-s:#FBF1DF;--bad:#C23B3B;--bad-s:#FBE7E7;--f:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--f);font-size:15px;line-height:1.5;color:var(--txt);background:var(--bg);-webkit-font-smoothing:antialiased;min-height:100vh}
.top{background:var(--ink);color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:10px}.brand img{height:22px}.brand i{width:1px;height:20px;background:rgba(255,255,255,.35)}.brand span{font-weight:600;letter-spacing:.12em;color:#9DB7F5}
.top button{background:transparent;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
main{max-width:640px;margin:0 auto;padding:18px 16px 60px}
h1{font-size:22px;margin:4px 0 4px}h2{font-size:17px;margin:0 0 10px}h3{font-size:15px;margin:16px 0 6px}
.muted{color:var(--mut)}.small{font-size:13px}.mono{font-family:ui-monospace,Consolas,monospace}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:14px;box-shadow:0 1px 2px rgba(10,23,51,.04)}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500;color:var(--mut);margin-top:12px}
input,select,textarea{font:inherit;font-size:16px;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri-s);border-color:var(--pri)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:600;border-radius:10px;padding:12px 16px;border:1px solid var(--line);background:#fff;color:var(--txt);cursor:pointer;text-decoration:none;min-height:46px}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--ink)}.btn.red{background:var(--bad);border-color:var(--bad);color:#fff}.btn.green{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.full{width:100%}.btn:disabled{opacity:.55;cursor:not-allowed}.btn.sm{min-height:36px;padding:7px 12px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hero{background:linear-gradient(135deg,var(--ink),var(--ink2));color:#fff;border-radius:16px;padding:22px 20px;margin-top:6px}
.hero small{color:#A9B6D3}.hero b{display:block;font-size:28px;margin:2px 0}
.badge{display:inline-block;font-size:12px;font-weight:600;border-radius:20px;padding:3px 10px}
.b-green{background:var(--ok-s);color:var(--ok)}.b-red{background:var(--bad-s);color:var(--bad)}.b-amber{background:var(--warn-s);color:var(--warn)}.b-blue{background:var(--pri-s);color:var(--pri)}.b-gray{background:#EEEDF4;color:var(--mut)}
.parc{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.parc:first-child{border-top:0}.parc .v{text-align:right}.parc .v b{display:block}
.aviso{border-radius:12px;padding:12px 14px;margin-top:12px;font-size:14px}.aviso.bad{background:var(--bad-s);color:#7A1F1F}.aviso.ok{background:var(--ok-s);color:#0B5B3F}.aviso.warn{background:var(--warn-s);color:#6E4508}
.erro{color:var(--bad);font-size:14px;min-height:20px;margin-top:8px}
.contrato{border:1px solid var(--line);border-radius:10px;padding:16px;max-height:52vh;overflow-y:auto;font-family:Georgia,serif;font-size:14px;line-height:1.6;background:#FCFCFE}
.contrato h4{font-family:var(--f);font-size:13.5px;margin:12px 0 4px}
.check{flex-direction:row;align-items:flex-start;gap:10px;color:var(--txt);font-weight:400;font-size:14px}.check input{width:22px;height:22px;flex:none;margin-top:1px}
canvas.sig{width:100%;height:180px;border:2px dashed #B9C6E4;border-radius:12px;background:#fff;touch-action:none;display:block}
.modal{position:fixed;inset:0;background:rgba(10,23,51,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal[hidden]{display:none}.mbox{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:20px 18px 28px;position:relative}
@media(min-width:620px){.modal{align-items:center}.mbox{border-radius:18px}}
.x{position:absolute;right:12px;top:10px;border:0;background:transparent;font-size:28px;line-height:1;color:var(--mut);cursor:pointer}
.qr{width:230px;margin:10px auto}.qr svg{width:100%;height:auto}
.cod{word-break:break-all;font-family:ui-monospace,Consolas,monospace;font-size:12px;background:#F4F4F8;border-radius:8px;padding:10px;color:var(--mut)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:30}
#toast div{background:var(--ink);color:#fff;border-radius:10px;padding:10px 16px;margin-top:8px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
#toast div.err{background:var(--bad)}#toast div.ok{background:var(--ok)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--pri-s);border-top-color:var(--pri);border-radius:50%;animation:g .8s linear infinite;vertical-align:-3px}
@keyframes g{to{transform:rotate(360deg)}}
.center{text-align:center}.ic{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;margin:0 auto 10px}.ic svg{width:32px;height:32px}
.ic.ok{background:var(--ok-s);color:var(--ok)}.ic.bad{background:var(--bad-s);color:var(--bad)}
a{color:var(--pri)}
.nps{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}.nps button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fff;font:inherit;font-weight:600;cursor:pointer}
.chat{max-height:46vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px}
.bolha{max-width:85%;padding:9px 13px;border-radius:14px;font-size:14px;line-height:1.45}.bolha.ia{background:#F0F3FA;align-self:flex-start;border-bottom-left-radius:4px}.bolha.eu{background:var(--pri);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.chat-btn{position:fixed;right:16px;bottom:18px;z-index:15;background:var(--ink);color:#fff;border:0;border-radius:24px;padding:12px 18px;font:inherit;font-weight:600;box-shadow:0 8px 24px rgba(10,23,51,.3);cursor:pointer}
</style>
</head>

const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = n => (Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const r2 = n => Math.round((Number(n)||0)*100)/100;
const onlyDig = s => String(s||'').replace(/\D/g,'');
function isoDate(d){ const z=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate()); }
const hoje = () => isoDate(new Date());
const fmtD = s => s ? String(s).split('-').reverse().join('/') : '—';
function fmtDT(ms){ if(!ms) return '—'; const d=new Date(ms); return d.toLocaleDateString('pt-BR')+' às '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }
function diasEntre(a,b){ const pa=a.split('-').map(Number), pb=b.split('-').map(Number); return Math.round((Date.UTC(pb[0],pb[1]-1,pb[2])-Date.UTC(pa[0],pa[1]-1,pa[2]))/86400000); }
function cpfOk(c){ c=onlyDig(c); if(c.length!==11||/^(\d)\1+$/.test(c)) return false; for(let t=9;t<11;t++){ let s=0; for(let i=0;i<t;i++) s+=+c[i]*(t+1-i); if(((s*10)%11)%10!==+c[t]) return false; } return true; }
const svg = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
function toast(t,k=''){ const d=document.createElement('div'); d.className=k; d.textContent=t; $('#toast').appendChild(d); setTimeout(()=>d.remove(),4200); }
function openModal(html){ $('#mbody').innerHTML=html; $('#modal').hidden=false; }
function closeModal(){ $('#modal').hidden=true; }
$('#mx').onclick=closeModal; $('#modal').addEventListener('click',e=>{ if(e.target.id==='modal') closeModal(); });
async function sha256(txt){ const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(String(txt))); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
const chaveAcesso = (cpf,nasc,tel4) => sha256(`nexumcell|${onlyDig(cpf)}|${nasc}|${onlyDig(tel4).slice(-4)}`);
const primeiroNome = n => String(n||'').trim().split(/\s+/)[0]||'';
const normNome = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim().toUpperCase();

/* ---------- dados (Firebase com login anônimo, ou demonstração) ---------- */
let fb=null;
const demoLer = () => { try{ return JSON.parse(localStorage.getItem(DEMO_KEY))||{}; }catch(e){ return {}; } };
const DB = {
  async get(c,id){
    if(!fb){ const d=demoLer(); const v=(d[c]||{})[id]; return v?{id,...v}:null; }
    const s=await fb.m.getDoc(fb.m.doc(fb.db,c,id)); return s.exists()?{id:s.id,...s.data()}:null;
  },
  async add(c,data){
    if(!fb){ const d=demoLer(); d[c]=d[c]||{}; const id='p'+Date.now().toString(36); d[c][id]=JSON.parse(JSON.stringify(data)); localStorage.setItem(DEMO_KEY,JSON.stringify(d)); return id; }
    const r=await fb.m.addDoc(fb.m.collection(fb.db,c),data); return r.id;
  },
  async set(c,id,data){
    if(!fb){ const d=demoLer(); d[c]=d[c]||{}; d[c][id]=Object.assign(d[c][id]||{},JSON.parse(JSON.stringify(data))); localStorage.setItem(DEMO_KEY,JSON.stringify(d)); return; }
    await fb.m.setDoc(fb.m.doc(fb.db,c,id),data,{merge:true});
  }
};
async function iniciarFirebase(){
  const base=`https://www.gstatic.com/firebasejs/${FBV}/`;
  const [a,au,m]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')]);
  const app=a.initializeApp(FIREBASE_CONFIG), auth=au.getAuth(app);
  if(!auth.currentUser) await au.signInAnonymously(auth);
  fb={m,db:m.getFirestore(app)};
}

/* ---------- faturas (mesma regra do app e do servidor) ---------- */
function valorHoje(p,ap){
  if(p.pago) return {valor:p.valor,dias:0,tipo:'pago'};
  const d=diasEntre(p.venc,hoje());
  if(d<0) return {valor:r2(p.valor*(1-(Number(ap.descontoPct)||0)/100)),dias:d,tipo:'antecipado'};
  if(d===0) return {valor:p.valor,dias:0,tipo:'hoje'};
  return {valor:r2(p.valor*(1+(Number(ap.multaPct)||0)/100+(Number(ap.moraDiaPct)||0)/100*d)),dias:d,tipo:'atraso'};
}
function quitacao(ap){
  const n=Number(ap.nParcelas)||(ap.parcelas||[]).length, fin=Number(ap.financiado)||0, principal=n?fin/n:0;
  let total=0, cheio=0;
  (ap.parcelas||[]).filter(p=>!p.pago).forEach(p=>{ const h=valorHoje(p,ap);
    const futura=diasEntre(p.venc,hoje())<0;
    if(futura&&principal>0){ total+=Math.min(principal,p.valor); cheio+=p.valor; }
    else if(futura){ total+=h.valor; cheio+=p.valor; }
    else { total+=h.valor; cheio+=h.valor; } });
  return {total:r2(total),desconto:r2(cheio-total)};
}
function etapas(ap){
  if(ap.etapaTotalDias!=null){ const t=Math.max(1,+ap.etapaTotalDias); return {parcial:Math.min(t,Math.max(1,+ap.etapaParcialDias||t)),total:t}; }
  const t=(Number(ap.toleranciaDias)||0)+1; return {parcial:t,total:t};
}
function situacao(ap){
  if(ap.roubo&&!ap.roubo.liberadoEm) return ['Roubo/perda comunicado — aparelho travado','red'];
  if(ap.quitado||ap.status==='QUITADO') return ['Contrato quitado','green'];
  if(ap.status==='CANCELADO') return ['Contrato encerrado','gray'];
  const atr=(ap.parcelas||[]).filter(p=>!p.pago&&diasEntre(p.venc,hoje())>0);
  if(atr.length){ const et=etapas(ap), maior=Math.max(...atr.map(p=>diasEntre(p.venc,hoje())));
    return [maior>=et.total?'Em atraso — aparelho bloqueado':maior>=et.parcial?'Em atraso — funções limitadas':`${atr.length} fatura(s) em atraso`,'red']; }
  return ['Faturas em dia','green'];
}

/* ---------- PIX (BR Code estático) ---------- */
const emv = (id,v) => id+String(v.length).padStart(2,'0')+v;
function crc16(s){ let c=0xFFFF; for(let i=0;i<s.length;i++){ c^=s.charCodeAt(i)<<8; for(let j=0;j<8;j++) c=(c&0x8000)?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF; } return c.toString(16).toUpperCase().padStart(4,'0'); }
function brcode(ap,valor,txid){
  const chave=String(ap.chavePix||'').trim(); if(!chave) return null;
  const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9 ]/g,'').toUpperCase().trim();
  let p=emv('00','01')+emv('26',emv('00','br.gov.bcb.pix')+emv('01',chave))+emv('52','0000')+emv('53','986')+emv('54',valor.toFixed(2))+emv('58','BR')
    +emv('59',norm(ap.recebedor||'NEXUMCELL').slice(0,25)||'NEXUMCELL')+emv('60',norm(ap.cidadeRecebedor||'FOZ DO IGUACU').slice(0,15)||'FOZ DO IGUACU')
    +emv('62',emv('05',String(txid||'***').replace(/[^A-Za-z0-9]/g,'').slice(0,25)||'***'))+'6304';
  return p+crc16(p);
}
async function pagar(tk,n,valor,descricao){
  const ap=S.aps[tk]; let codigo=null, auto=false, v=valor;
  const serv=String(ap.servidorPix||'').trim().replace(/\/$/,'');
  if(n>0&&serv.startsWith('https://')){
    openModal('<p class="center"><span class="spin"></span> Gerando o PIX…</p>');
    try{ const r=await fetch(serv+'/api/pix',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:tk,n})}); if(r.ok){ const j=await r.json(); if(j.copiaECola){ codigo=j.copiaECola; v=j.valor||valor; auto=true; } } }catch(e){}
  }
  if(!codigo) codigo=brcode(ap,valor,`NXC${ap.vendaNumero}${n>0?'P'+n:'Q'}`);
  if(!codigo){ openModal('<h2>PIX indisponível</h2><p>A loja ainda não cadastrou a chave PIX. Fale com a loja pelo WhatsApp.</p>'+zapLoja(ap)); return; }
  let qr=''; try{ const q=qrcode(0,'M'); q.addData(codigo); q.make(); qr=q.createSvgTag({cellSize:4,margin:2,scalable:true}); }catch(e){}
  openModal(`<h2>Pagar com PIX</h2><p class="center" style="margin:0"><b style="font-size:26px">${brl(v)}</b><br><span class="muted">${esc(descricao)}</span></p>
    <div class="qr">${qr}</div><div class="cod" id="pixCod">${esc(codigo)}</div>
    <button class="btn pri full" style="margin-top:12px" id="copiarPix">Copiar código PIX</button>
    <p class="small muted">${auto?'O pagamento é confirmado sozinho: em poucos minutos a fatura aparece como paga e o aparelho é liberado.':'Abra o app do seu banco, escolha PIX copia e cola e cole o código. Depois envie o comprovante para a loja.'}</p>`);
  $('#copiarPix').onclick=()=>navigator.clipboard?.writeText(codigo).then(()=>toast('Código copiado. Cole no app do banco.','ok'));
}
const zapLoja = ap => { const t=onlyDig(ap.lojaTelefone||ap.telefoneSuporte); return t?`<a class="btn green full" style="margin-top:10px" target="_blank" rel="noopener" href="https://wa.me/55${t}">Falar com a ${esc(ap.lojaNome||'loja')} no WhatsApp</a>`:''; };

async function entrar(){
  const cpf=onlyDig($('#lCpf').value), nasc=$('#lNasc').value, tel=onlyDig($('#lTel').value), msg=$('#lMsg');
  if(S.bloqAte>Date.now()) return msg.textContent=`Muitas tentativas. Aguarde ${Math.ceil((S.bloqAte-Date.now())/1000)} segundos.`;
  if(!cpfOk(cpf)) return msg.textContent='CPF inválido.';
  if(!nasc||tel.length!==4) return msg.textContent='Preencha a data de nascimento e os 4 dígitos do celular.';
  $('#lBtn').disabled=true; msg.textContent='';
  try{
    let tokens=[];
    if(fb){ const a=await DB.get('acessos',await chaveAcesso(cpf,nasc,tel)); tokens=a?.tokens||[]; }
    else { const d=demoLer(); tokens=Object.values(d.vendas||{}).filter(v=>v.clienteCpf===cpf&&v.cliente?.nasc===nasc&&onlyDig((v.cliente?.telefones||[])[0]).slice(-4)===tel&&v.aparelhoToken).map(v=>v.aparelhoToken); }
    if(!tokens.length){ S.falhas++; if(S.falhas>=5){ S.bloqAte=Date.now()+60000; S.falhas=0; } $('#lBtn').disabled=false; return msg.textContent='Não encontramos contrato com esses dados. Confira e tente de novo.'; }
    S.tokens=tokens; sessionStorage.setItem('nxc_cli',JSON.stringify(tokens)); await telaContratos();
  }catch(e){ console.error(e); msg.textContent='Não foi possível entrar agora. Verifique a internet e tente de novo.'; $('#lBtn').disabled=false; }
}

async function telaContratos(){
  $('#sair').hidden=false;

  S.aps={}; aps.forEach(a=>S.aps[a.id]=a);
  if(!aps.length){ sessionStorage.removeItem('nxc_cli'); return telaLogin('Contrato não encontrado.'); }
  aps.sort((a,b)=>(b.criadoEm||0)-(a.criadoEm||0));
  if(!$('#chatBtn')) document.body.insertAdjacentHTML('beforeend','<button id="chatBtn" class="chat-btn" aria-label="Tirar dúvidas">💬 Dúvidas</button>');
  $('#app').innerHTML=`<h1>Olá, ${esc(aps[0].clienteNome||'cliente')}!</h1><p class="muted" style="margin:0">${aps.length>1?aps.length+' contratos':'Seu contrato'} com a ${esc(aps[0].recebedor||'NexumCell')}</p>`+aps.map(cardContrato).join('');
}

  return {pp,saldo,reais:r2(saldo/100*(Number(ap.pontosValor)||0))}; }

/* ---------- assistente: tira dúvidas sobre o contrato ---------- */
function respostaLocal(txt){
  const t=normNome(txt), aps=Object.values(S.aps), ap=aps[0]; if(!ap) return 'Entre com seus dados para eu consultar seu contrato.';
  const ab=(ap.parcelas||[]).filter(p=>!p.pago), atr=ab.filter(p=>diasEntre(p.venc,hoje())>0), prox=ab[0];
  const soma=atr.reduce((s,p)=>s+valorHoje(p,ap).valor,0);
  if(/DEVO|DIVIDA|ATRAS|DEBITO|EM ABERTO/.test(t)) return atr.length?`Você tem ${atr.length} parcela(s) em atraso, que hoje somam ${brl(soma)} já com multa e juros. Toque em “Pagar” na parcela para gerar o PIX.`:`Você está em dia! ${prox?`A próxima parcela (${prox.n}) vence ${fmtD(prox.venc)}: ${brl(valorHoje(prox,ap).valor)} pagando até lá.`:''}`;
  if(/PIX|PAGAR|PAGAMENTO|BOLETO|CHAVE/.test(t)) return prox?`Para pagar, toque em “Pagar” na parcela ${prox.n} aqui em cima: aparece o QR code e o código PIX copia e cola. ${ap.chavePix?'A chave PIX da loja é '+ap.chavePix+'.':''}`:'Seu contrato não tem parcelas em aberto.';
  if(/VENC|QUANDO|DATA|DIA/.test(t)) return prox?`A parcela ${prox.n} vence ${fmtD(prox.venc)}. Pagando antes, você ganha ${Number(ap.descontoPct)||0}% de desconto. Se quiser mudar o dia do vencimento, use o botão “Mudar dia do vencimento”.`:'Não há parcelas em aberto.';
  if(/QUIT|ANTECIP|ADIANT|TERMINAR|FINALIZAR/.test(t)){ const q=quitacao(ap); return ab.length?`Para quitar hoje, o valor é ${brl(q.total)} (economia de ${brl(q.desconto)}). Use o botão “Quitar com PIX”.`:'Seu contrato já está quitado. Você pode baixar o termo de quitação aqui no portal.'; }
  if(/BLOQUE|TRAV|LIBER|DESBLOQ/.test(t)) return atr.length?`O aparelho é limitado ou bloqueado quando há parcela em atraso. Pague ${brl(soma)} e ele é liberado sozinho em poucos minutos (ou toque em “Já paguei — verificar” no celular). Na tela de bloqueio também existe a liberação de 24 h, uma vez por mês.`:'Seu contrato está em dia, então o aparelho não deve estar bloqueado. Se estiver, abra o NexumCell no celular e toque em “Já paguei — verificar” com a internet ligada.';
  if(/PONTO/.test(t)){ const pt=pontos(ap); return `Você tem ${pt.saldo} pontos (${brl(pt.reais)}). Use na loja como desconto em acessórios ou no próximo celular.`; }
  if(/ROUB|FURT|PERD/.test(t)) return 'Sinto muito! Toque em “Roubo, furto ou perda” no seu contrato: o aparelho é travado e mostramos o passo a passo do boletim e do bloqueio do IMEI.';
  if(/DEFEIT|QUEBR|CONSERT|GARANT|TELA/.test(t)) return 'Toque em “Meu aparelho deu defeito” e descreva o problema. A loja responde por aqui e pelo WhatsApp.';
  if(/ATENDENTE|PESSOA|HUMANO|LOJA|WHATS|FALAR/.test(t)) return `Claro! Fale com a ${ap.lojaNome||'loja'} pelo botão do WhatsApp no seu contrato${ap.lojaTelefone?' ou pelo número '+ap.lojaTelefone:''}.`;
  return null;
}
async function perguntar(txt){
  const box=$('#chatMsgs'); const add=(quem,t)=>{ box.insertAdjacentHTML('beforeend',`<div class="bolha ${quem}">${esc(t)}</div>`); box.scrollTop=box.scrollHeight; };
  add('eu',txt); let r=respostaLocal(txt);
  const ap=Object.values(S.aps)[0], serv=String(ap?.servidorPix||'').trim().replace(/\/$/,'');
  if(!r&&serv.startsWith('https://')){ add('ia','…'); try{ const x=await fetch(serv+'/api/assistente',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:ap.id,pergunta:txt.slice(0,500)})}); if(x.ok) r=(await x.json()).resposta; }catch(e){} box.lastElementChild.remove(); }
  add('ia',r||'Não entendi bem. Você pode perguntar, por exemplo: “quanto eu devo?”, “quando vence?”, “como quito?” ou “falar com atendente”.');
}

function fotoReduzida(file,max=1100,q=0.7){ return new Promise((ok,er)=>{ const fr=new FileReader(); fr.onload=()=>{ const im=new Image(); im.onload=()=>{ let w=im.width,h=im.height; const k=Math.min(1,max/Math.max(w,h)); w=Math.round(w*k); h=Math.round(h*k);
  const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(im,0,0,w,h); let d=c.toDataURL('image/jpeg',q); if(d.length>300000) d=c.toDataURL('image/jpeg',0.5); ok(d); }; im.onerror=()=>er(new Error('Imagem inválida')); im.src=fr.result; }; fr.onerror=er; fr.readAsDataURL(file); }); }

async function telaAssinar(tk){
  const a=await DB.get('assinaturas',tk).catch(()=>null);
  if(!a){ $('#app').innerHTML=`<div class="card center"><div class="ic bad">${svg('<path d="M18 6 6 18M6 6l12 12"/>')}</div><h2>Link inválido</h2><p class="muted">Peça um novo link para a loja.</p></div>`; return; }
  if(a.status==='ASSINADO'){
    $('#app').innerHTML=`<div class="card center"><div class="ic ok">${svg('<path d="M20 6 9 17l-5-5"/>')}</div><h2>Contrato assinado</h2>
      <p class="muted">Contrato nº ${esc(a.numero||'')} · assinado em ${fmtDT(a.assinadoEm)} ${a.via==='LOJA'?'na loja':'no celular do comprador'}.</p>
      ${a.codigo?`<p>Código de verificação: <b class="mono">${esc(a.codigo)}</b></p><p class="cod">SHA-256: ${esc(a.hash)}</p>`:'<p class="small muted">O código de verificação aparece assim que a loja registrar a assinatura.</p>'}</div>
      <div class="card"><h2>Texto do contrato</h2><div class="contrato">${a.contrato||''}</div>${a.assinatura?`<h3>Assinatura</h3><img src="${a.assinatura}" style="max-width:100%;border:1px solid var(--line);border-radius:10px">`:''}</div>`;
    return;
  }
  if(a.expiraEm&&a.expiraEm<Date.now()){ $('#app').innerHTML=`<div class="card center"><div class="ic bad">${svg('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>')}</div><h2>Link expirado</h2><p class="muted">Este link valia por 24 horas. Peça um novo para o vendedor.</p></div>`; return; }
  $('#app').innerHTML=`<div class="hero"><small>Assinatura do contrato nº ${esc(a.numero)}</small><b style="font-size:22px">Olá, ${esc(primeiroNome(a.clienteNome))}!</b><span style="color:#C9D4EE">Leia o contrato com calma antes de assinar. ${esc(a.empresa||'')} · ${esc(a.lojaNome||'')}</span></div>
    <div class="card"><h2>Contrato</h2><div class="contrato">${a.contrato}</div>
      <label class="check" style="margin-top:14px"><input type="checkbox" id="sgAceite"> <span>Li o contrato e <b>concordo com a cláusula 5</b>: o aparelho pode ser bloqueado se eu atrasar as parcelas.</span></label>
      <label class="check"><input type="checkbox" id="sgLgpd"> <span>Autorizo o tratamento dos meus dados pessoais e da biometria (cláusula 6).</span></label>
      <label>Digite seu nome completo<input id="sgNome" autocomplete="name"></label>
      <h3>Assine com o dedo</h3><canvas id="sig" class="sig"></canvas>
      <div class="row" style="justify-content:space-between;margin-top:8px"><button class="btn sm" id="sgLimpar">Limpar</button><span class="small muted">Assine dentro do quadro</span></div>
      <div class="erro" id="sgMsg"></div>
      <button class="btn pri full" id="sgBtn">Assinar contrato</button></div>`;
  const cv=$('#sig'); setupSig(cv);
  $('#sgLimpar').onclick=()=>setupSig(cv);
  $('#sgBtn').onclick=async()=>{
    const m=$('#sgMsg'); m.textContent='';
    if(!$('#sgAceite').checked||!$('#sgLgpd').checked) return m.textContent='Marque as duas autorizações.';
    if(normNome($('#sgNome').value)!==normNome(a.clienteNome)) return m.textContent='Digite seu nome completo igual ao do documento.';
    if(cv._vazio) return m.textContent='Falta a sua assinatura.';
    $('#sgBtn').disabled=true;
    try{
      await DB.set('assinaturas',tk,{status:'ASSINADO',assinatura:reduzir(cv),assinadoEm:Date.now(),aceites:{bloqueio:true,lgpd:true},dispositivo:navigator.userAgent.slice(0,180),nomeDigitado:$('#sgNome').value.trim()});
      // carimbo do servidor: grava data/hora do servidor, IP e hash do contrato (prova da assinatura)
      let carimbo=null; const serv=String(a.servidor||'').replace(/\/$/,'');
      if(serv.startsWith('https://')&&!DEMO){ try{ const r=await fetch(serv+'/api/assinatura',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({acao:'carimbo',tk})}); if(r.ok) carimbo=await r.json(); }catch(e){} }

    }catch(e){ console.error(e); m.textContent='Não foi possível assinar. O link pode ter expirado: peça um novo ao vendedor.'; $('#sgBtn').disabled=false; }
  };
}
function setupSig(cv){
  const r=cv.getBoundingClientRect(), dpr=window.devicePixelRatio||1; cv.width=r.width*dpr; cv.height=r.height*dpr;
  const ctx=cv.getContext('2d'); ctx.scale(dpr,dpr); ctx.lineWidth=2.4; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#0B1E35';
  let on=false; cv._vazio=true; const pt=e=>{ const b=cv.getBoundingClientRect(); return [e.clientX-b.left,e.clientY-b.top]; };
  cv.onpointerdown=e=>{ on=true; cv.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.moveTo(...pt(e)); };
  cv.onpointermove=e=>{ if(!on) return; ctx.lineTo(...pt(e)); ctx.stroke(); cv._vazio=false; };
  cv.onpointerup=cv.onpointercancel=()=>{ on=false; };
}
function reduzir(cv){ const w=600, h=Math.round(cv.height*w/cv.width); const c=document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,w,h); x.drawImage(cv,0,0,w,h); return c.toDataURL('image/jpeg',0.7); }

let LANG=(()=>{ try{ return localStorage.getItem('nxc_lang')||((navigator.language||'').toLowerCase().startsWith('es')?'es':'pt'); }catch(e){ return 'pt'; } })();
const ES_ORD=ES.slice().sort((a,b)=>b[0].length-a[0].length);
const ES_RX=ES_ORD.map(([a,b])=>{ if(a.trim().length>=9) return [a,b,null]; const L='A-Za-zÀ-ú', esc=a.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return [a,b,new RegExp((/[A-Za-zÀ-ú]/.test(a[0])?'(^|[^'+L+'])':'()')+esc+(/[A-Za-zÀ-ú]/.test(a[a.length-1])?'(?=$|[^'+L+'])':''),'g')]; });
function trEs(t){ if(!t||!/[A-Za-zÀ-ú]/.test(t)) return t; let r=t; for(const [a,b,rx] of ES_RX){ if(!r.includes(a)) continue; r=rx?r.replace(rx,(m,pre)=>pre+b):r.split(a).join(b); } return r; }
function traduzirNo(n){
  if(LANG!=='es') return;
  const w=document.createTreeWalker(n,NodeFilter.SHOW_TEXT,{acceptNode:x=>x.parentNode&&!['SCRIPT','STYLE','TEXTAREA'].includes(x.parentNode.nodeName)&&!x.parentNode.closest('.contrato')?1:2});
  let x; while((x=w.nextNode())){ const t=trEs(x.nodeValue); if(t!==x.nodeValue) x.nodeValue=t; }
  (n.querySelectorAll?n.querySelectorAll('[placeholder]'):[]).forEach(e=>{ const t=trEs(e.placeholder); if(t!==e.placeholder) e.placeholder=t; });
}
new MutationObserver(ms=>{ if(LANG!=='es') return; ms.forEach(m=>m.addedNodes.forEach(n=>{ if(n.nodeType===1) traduzirNo(n); else if(n.nodeType===3&&n.parentNode) traduzirNo(n.parentNode); })); }).observe(document.body,{childList:true,subtree:true});
